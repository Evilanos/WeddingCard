# Mencegah project Supabase free tier di-pause karena tidak ada aktivitas (±1 minggu).
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Catatan: GitHub menonaktifkan scheduled workflow jika repo tidak ada commit selama 60 hari.
# Cek tab Actions secara berkala, atau upgrade ke Supabase Pro selama periode blast s/d hari-H.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 1 */2 * *' # tiap 2 hari, 08.00 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_settings" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
